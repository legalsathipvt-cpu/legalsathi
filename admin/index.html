<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4ead6">
<title>LegalSaathi Admin</title>
<link rel="icon" href="../legalsathilogo.webp">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4ead6;--ivory:#2a1a0f;--mut:#6f5a43;--gold:#a8741a;--gold2:#c48d2c;--ink:#1a120b;--line:rgba(90,60,30,.18);--glass:linear-gradient(145deg,rgba(255,255,255,.8),rgba(255,248,232,.45))}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ivory);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(800px 400px at 90% -5%,rgba(233,189,95,.3),transparent 60%),linear-gradient(rgba(90,60,30,.05) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(90,60,30,.05) 1px,transparent 1px) 0 0/48px 48px,var(--bg)}
h1,h2,h3,.brand{font-family:'Playfair Display',serif}
[hidden]{display:none!important}
.i{width:1.2em;height:1.2em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;font:700 .85rem 'Plus Jakarta Sans';padding:11px 20px;border-radius:50px;color:var(--ink);text-decoration:none;background:linear-gradient(180deg,#f6d27c,var(--gold2));box-shadow:0 4px 0 #7d5513,0 10px 18px rgba(196,141,44,.25),inset 0 1px 0 rgba(255,255,255,.6)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d5513}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:0 4px 0 rgba(90,60,30,.25),inset 0 1px 0 #fff}
.btn.red{background:#b3261e;color:#fff;box-shadow:0 4px 0 #6d1511}
.btn.sm{padding:8px 15px;font-size:.76rem}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);font:.9rem 'Plus Jakarta Sans';background:#fff;color:var(--ivory);margin-bottom:10px}
input[type=checkbox]{width:auto;margin:0}
label.l{display:block;font-size:.72rem;font-weight:600;color:var(--mut);margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:18px;box-shadow:0 12px 28px rgba(90,60,30,.16),inset 0 1px 0 #fff}
small{color:var(--mut);font-size:.74rem;display:block;margin-top:2px}
/* login */
#login{min-height:100dvh;display:grid;place-items:center;padding:22px}
#login .card{width:min(400px,100%);padding:30px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.2rem;margin-bottom:18px}.brand img{height:36px;width:36px;border-radius:8px;object-fit:contain}.brand b{color:var(--gold)}
.err{color:#b3261e;font-size:.82rem;margin-top:8px}
/* app shell */
#app{display:grid;grid-template-columns:1fr;min-height:100dvh}
aside{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(135deg,rgba(255,252,242,.85),rgba(255,244,220,.7));backdrop-filter:blur(20px);border-top:1px solid #fff;box-shadow:0 -8px 24px rgba(90,60,30,.15)}
aside .brand,aside .who{display:none}
aside button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;font:600 .62rem 'Plus Jakarta Sans';color:var(--mut);padding:6px 10px;border-radius:14px;cursor:pointer}
aside button .i{font-size:1.4rem}aside button.on{color:var(--ink);background:rgba(233,189,95,.3)}
.bd{position:absolute;top:0;right:4px;min-width:17px;height:17px;border-radius:9px;background:#b3261e;color:#fff;font:700 .6rem sans-serif;display:grid;place-items:center;font-style:normal;padding:0 4px}
main{padding:16px 16px 100px;max-width:1100px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.top h1{font-size:1.5rem}.top .act{display:flex;gap:8px;align-items:center}
.role{font-size:.66rem;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--ink);color:#f2c75c;text-transform:uppercase;letter-spacing:.06em}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);cursor:pointer;color:var(--ivory);display:grid;place-items:center;font-size:1.1rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.stats .card b{display:block;font:800 1.8rem 'Playfair Display';color:var(--gold)}.stats .card span{font-size:.72rem;color:var(--mut)}
h2{font-size:1.05rem;margin:18px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;margin-bottom:10px;background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 8px 18px rgba(90,60,30,.12);cursor:pointer;font-size:.88rem}
.row>div{min-width:0}.row small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{flex:none;font-size:.68rem;font-weight:700;padding:5px 11px;border-radius:20px;background:rgba(90,60,30,.1);color:var(--ivory)}
.st.ok{background:#d9f2dd;color:#1b6b2f}.st.warn{background:#ffe7b3;color:#8a5a00}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools input:first-child{grid-column:1/-1}
.empty{text-align:center;color:var(--mut);padding:30px;font-size:.88rem}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(26,18,11,.55);backdrop-filter:blur(4px);z-index:60;display:none}.ov.on{display:block}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:61;background:#f9f1de;padding:20px 18px calc(30px + env(safe-area-inset-bottom));overflow-y:auto;transform:translateX(100%);transition:.3s;box-shadow:-20px 0 50px rgba(0,0,0,.3)}.dw.on{transform:none}
.dw h3{font-size:1.25rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.86rem}.kv span{color:var(--mut);flex:none}.kv b{text-align:right;font-weight:600;word-break:break-word}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tl{list-style:none;margin:10px 0}.tl li{display:flex;gap:12px;padding:0 0 16px;position:relative;font-size:.88rem;cursor:pointer}
.tl li:not(:last-child):before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl li>i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:#fff;color:#fff;font-size:.8rem}
.tl li.done>i{background:var(--gold2);border-color:var(--gold2)}.tl li.cur>i{border-color:var(--gold2);box-shadow:0 0 0 4px rgba(196,141,44,.25)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:8px 0}
.files a{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;text-decoration:none;color:var(--ivory);font-size:.7rem;text-align:center}
.files img{width:100%;height:84px;object-fit:cover;display:block}.files span{display:block;padding:30px 4px;font-weight:700}
/* services */
.svc{padding:14px 16px;margin-bottom:10px;background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 8px 18px rgba(90,60,30,.12)}
.svc .r1{display:flex;align-items:center;gap:10px;justify-content:space-between}.svc b{font-size:.92rem}
.svc .r2{display:flex;gap:10px;align-items:center;margin-top:10px}.svc .r2 input{width:110px;margin:0}.svc .fl{font-size:.7rem;color:var(--mut);margin-top:8px}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}.sw i{position:absolute;inset:0;border-radius:20px;background:#cdbf9f;transition:.2s}.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}.sw input:checked+i{background:var(--gold2)}.sw input:checked+i:after{left:23px}
.fr{display:grid;grid-template-columns:1fr 70px auto;gap:6px;align-items:center;margin-bottom:6px}.fr input{margin:0}.fr .ib{width:34px;height:34px}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;left:12px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;width:min(360px,100%);padding:13px 16px;border-radius:16px;background:var(--ink);color:#f6ead2;font-size:.85rem;box-shadow:0 14px 30px rgba(0,0,0,.4);border-left:4px solid #f2c75c;cursor:pointer;animation:in .3s}.toast b{display:block;color:#f2c75c}
@keyframes in{from{transform:translateY(-14px);opacity:0}}
@media(min-width:900px){#app{grid-template-columns:230px 1fr}aside{position:sticky;top:0;height:100dvh;flex-direction:column;justify-content:flex-start;gap:6px;padding:22px 14px;border-top:0;border-right:1px solid #fff}aside .brand{display:flex;margin:0 6px 18px}aside button{flex-direction:row;gap:10px;font-size:.85rem;padding:12px 14px;width:100%}aside button .i{font-size:1.2rem}.bd{top:10px;right:12px}main{padding:28px 32px 40px}.stats{grid-template-columns:repeat(4,1fr)}.tools{grid-template-columns:2fr 1fr 1fr}.tools input:first-child{grid-column:auto}#toasts{left:auto}}
</style>
</head>
<body>
<div id="login" hidden><form class="card" id="lf"><div class="brand"><img src="../legalsathilogo.webp" alt="" onerror="this.style.display='none'">Legal<b>Saathi</b></div><h2 style="margin:0 0 14px">Admin sign in</h2><label class="l">Email</label><input id="le" type="email" autocomplete="username" required><label class="l">Password</label><input id="lp" type="password" autocomplete="current-password" required><button class="btn" style="width:100%">Sign in</button><p class="err" id="lerr"></p></form></div>

<div id="app" hidden>
<aside>
  <div class="brand"><img src="../legalsathilogo.webp" alt="" onerror="this.style.display='none'">Legal<b>Saathi</b></div>
  <button data-t="dash" class="on"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</button>
  <button data-t="orders"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Orders<em class="bd" id="b-o" hidden></em></button>
  <button data-t="joins"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a7 7 0 0 1 4 7"/></svg>Join Requests<em class="bd" id="b-j" hidden></em></button>
  <button data-t="services"><svg class="i" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg>Services</button>
  <button data-t="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</button>
</aside>
<main>
  <div class="top"><h1 id="ttl">Dashboard</h1><div class="act"><span class="role" id="role"></span><button class="ib" id="bell" title="Alerts" aria-label="Enable alerts"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg></button><button class="ib" id="out" title="Sign out" aria-label="Sign out"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 8l5 4-5 4M21 12H9"/></svg></button></div></div>
  <section id="t-dash"></section>
  <section id="t-orders" hidden><div class="tools"><input id="oq" placeholder="Search token, name or phone"><select id="of"><option value="act">Active</option><option value="need">Needs action</option><option value="done">Delivered</option><option value="">All</option></select><select id="os"></select></div><div id="ol"></div></section>
  <section id="t-joins" hidden><div class="tools"><select id="jf" style="grid-column:1/-1"><option value="new">New</option><option value="done">Handled</option><option value="">All</option></select></div><div id="jl"></div></section>
  <section id="t-services" hidden></section>
  <section id="t-settings" hidden></section>
</main>
</div>

<div class="ov" id="ov"></div>
<div class="dw" id="dw"></div>
<div class="dw" id="fw"></div>
<div id="toasts"></div>

<script src="../config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const P={check:'<path d="m5 12 5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',up:'<path d="M6 15l6-6 6 6"/>',dn:'<path d="M6 9l6 6 6-6"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const sb=window.supabase.createClient(SB.url||"https://placeholder.supabase.co",SB.key||"placeholder");
let me=null,svcs=[],ords=[],joins=[],stf=[],cfg={},tab="dash",cur=null,unread=0,fl=[],fs="";
const own=()=>me&&me.role=="owner";
const ago=t=>{const m=Math.floor((Date.now()-new Date(t))/6e4);return m<1?"just now":m<60?m+"m ago":m<1440?Math.floor(m/60)+"h ago":new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short"})};
const tm=t=>new Date(t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const svc=id=>svcs.find(s=>s.id==id)||{};
function live(o){const f=svc(o.service_id).flow||[],n=f.length;let i=Math.min(o.status_idx,Math.max(n-1,0)),t=new Date(o.status_at).getTime();while(n){const m=f[i]?f[i].m:null;if(m==null||i>=n-1||t+m*6e4>Date.now())break;t+=m*6e4;i++}return{f,i,t,n,done:n>0&&i>=n-1,gate:n>0&&i<n-1&&f[i].m==null}}
/* alerts */
function toast(t,b,fn){const e=document.createElement("div");e.className="toast";e.innerHTML=`<b>${esc(t)}</b>${esc(b)}`;e.onclick=()=>{fn&&fn();e.remove()};$("#toasts").appendChild(e);setTimeout(()=>e.remove(),9000)}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);o.start();o.stop(a.currentTime+.6)}catch(_){}}
function ping(t,b,fn){toast(t,b,fn);beep();try{if(Notification.permission=="granted")new Notification(t,{body:b,icon:"../legalsathilogo.webp"})}catch(_){}unread++;document.title=`(${unread}) LegalSaathi Admin`}
addEventListener("focus",()=>{unread=0;document.title="LegalSaathi Admin"});
$("#bell").onclick=async()=>{try{const r=await Notification.requestPermission();toast(r=="granted"?"Alerts on":"Alerts blocked",r=="granted"?"You will get a sound and a popup for every new order or join request while this page is open.":"Allow notifications in your browser settings.")}catch(_){toast("Not supported","This browser does not support notifications.")}};
/* auth */
$("#lf").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";const{error}=await sb.auth.signInWithPassword({email:$("#le").value,password:$("#lp").value});error?$("#lerr").textContent="Wrong email or password.":enter()};
$("#out").onclick=async()=>{await sb.auth.signOut();location.reload()};
async function enter(){const{data:{user}}=await sb.auth.getUser();if(!user){$("#login").hidden=false;return}
 const{data:s}=await sb.from("staff").select("name,role,user_id").eq("user_id",user.id).maybeSingle();
 if(!s){await sb.auth.signOut();$("#login").hidden=false;$("#lerr").textContent="This account has no admin access.";return}
 me=s;$("#login").hidden=true;$("#app").hidden=false;$("#role").textContent=s.role;await load();subs();setInterval(render,3e4)}
async function load(){const[a,b,c,d]=await Promise.all([sb.from("services").select("*").order("sort"),sb.from("orders").select("*").order("created_at",{ascending:false}).limit(500),sb.from("join_requests").select("*").order("created_at",{ascending:false}).limit(300),sb.from("settings").select("*")]);
 svcs=a.data||[];ords=b.data||[];joins=c.data||[];cfg=Object.fromEntries((d.data||[]).map(x=>[x.key,x.value]));
 if(own()){const s=await sb.from("staff").select("*");stf=s.data||[]}
 $("#os").innerHTML='<option value="">All services</option>'+svcs.map(s=>`<option value="${esc(s.id)}">${esc(s.title)}</option>`).join("");render()}
function subs(){sb.channel("live").on("postgres_changes",{event:"INSERT",schema:"public",table:"orders"},p=>{ords.unshift(p.new);ping("New order "+p.new.token,p.new.service_title+" · "+p.new.name,()=>{go("orders");openO(p.new.id)});render()})
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"orders"},p=>{const i=ords.findIndex(o=>o.id==p.new.id);if(i>-1){ords[i]=p.new;render();if(cur==p.new.id)openO(cur)}})
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"join_requests"},p=>{joins.unshift(p.new);ping("New join request",p.new.name+" · "+p.new.role,()=>go("joins"));render()}).subscribe()}
/* nav */
const T={dash:"Dashboard",orders:"Orders",joins:"Join Requests",services:"Services",settings:"Settings"};
function go(t){tab=t;document.querySelectorAll("aside button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));Object.keys(T).forEach(k=>$("#t-"+k).hidden=k!=t);$("#ttl").textContent=T[t];render();scrollTo(0,0)}
document.querySelectorAll("aside button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function render(){const nj=joins.filter(j=>!j.handled).length,ng=ords.filter(o=>live(o).gate).length;
 $("#b-j").hidden=!nj;$("#b-j").textContent=nj;$("#b-o").hidden=!ng;$("#b-o").textContent=ng;
 ({dash:rDash,orders:rOrders,joins:rJoins,services:rSvc,settings:rSet})[tab]()}
const oRow=o=>{const L=live(o);return`<div class="row" data-o="${o.id}"><div><b>${esc(o.token)}</b> · ${esc(o.service_title)}<small>${esc(o.name)} · ${esc(o.phone)} · ${ago(o.created_at)}</small></div><span class="st ${L.done?"ok":L.gate?"warn":""}">${esc(L.f[L.i]?L.f[L.i].n:"-")}</span></div>`};
function rDash(){const d0=new Date().setHours(0,0,0,0),L=ords.map(o=>[o,live(o)]),today=ords.filter(o=>new Date(o.created_at)>=d0).length,need=L.filter(x=>x[1].gate),act=L.filter(x=>!x[1].done).length,dl=L.filter(x=>x[1].done),rev=dl.reduce((a,x)=>a+(svc(x[0].service_id).price||0),0);
 $("#t-dash").innerHTML=`<div class="stats"><div class="card"><b>${today}</b><span>New today</span></div><div class="card"><b>${act}</b><span>Active orders</span></div><div class="card"><b>${need.length}</b><span>Needs action</span></div><div class="card"><b>₹${rev.toLocaleString("en-IN")}</b><span>Delivered value (approx.)</span></div></div>
 <h2>Needs action</h2>${need.length?need.slice(0,6).map(x=>oRow(x[0])).join(""):'<div class="empty">Nothing waiting. All good.</div>'}
 <h2>Latest orders</h2>${ords.slice(0,6).map(oRow).join("")||'<div class="empty">No orders yet.</div>'}
 <h2>New join requests</h2>${joins.filter(j=>!j.handled).slice(0,4).map(jRow).join("")||'<div class="empty">No new requests.</div>'}`}
function rOrders(){const q=$("#oq").value.toLowerCase(),f=$("#of").value,s=$("#os").value;
 const a=ords.filter(o=>{const L=live(o);if(s&&o.service_id!=s)return false;if(f=="act"&&L.done)return false;if(f=="need"&&!L.gate)return false;if(f=="done"&&!L.done)return false;return!q||(o.token+o.name+o.phone).toLowerCase().includes(q)});
 $("#ol").innerHTML=a.map(oRow).join("")||'<div class="empty">No orders found.</div>'}
["oq","of","os"].forEach(i=>$("#"+i).oninput=rOrders);$("#jf").oninput=()=>rJoins();
const jRow=j=>`<div class="row" style="cursor:default;align-items:flex-start"><div><b>${esc(j.name)}</b> · ${esc(j.role)}<small style="white-space:normal">${esc(j.phone)} · ${ago(j.created_at)}</small>${j.note?`<small style="white-space:normal;margin-top:6px">${esc(j.note)}</small>`:""}<div class="btns" style="margin:10px 0 0"><a class="btn sm" href="tel:+91${esc(j.phone)}">Call</a><a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/91${esc(j.phone)}">WhatsApp</a><button class="btn sm ghost" data-jh="${j.id}">${j.handled?"Mark new":"Mark handled"}</button>${own()?`<button class="btn sm red" data-jd="${j.id}">Delete</button>`:""}</div></div></div>`;
function rJoins(){const f=$("#jf").value,a=joins.filter(j=>f==""||(f=="new"?!j.handled:j.handled));$("#jl").innerHTML=a.map(jRow).join("")||'<div class="empty">Nothing here.</div>'}
/* orders drawer */
function setDw(h){$("#dw").innerHTML=h;$("#dw").classList.add("on");$("#ov").classList.add("on")}
function closeDw(){$("#dw").classList.remove("on");$("#fw").classList.remove("on");$("#ov").classList.remove("on");cur=null}
$("#ov").onclick=closeDw;
async function openO(id){const o=ords.find(x=>x.id==id);if(!o)return;cur=id;const L=live(o);let t=L.t,e="";
 const steps=L.f.map((s,i)=>`<li data-k="${i}" class="${i<L.i?"done":i==L.i?"cur":""}"><i>${i<L.i?ic("check"):""}</i><div><b>${esc(s.n)}</b><small>${i==L.i?"Current · since "+tm(L.t):s.m==null?"Manual":s.m+" min"}</small></div></li>`).join("");
 const ex=Object.entries(o.extra||{}).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("");
 setDw(`<h3>${esc(o.token)}<button class="ib" data-x aria-label="Close">${ic("x")}</button></h3>
 <div class="kv"><span>Service</span><b>${esc(o.service_title)}</b></div><div class="kv"><span>Customer</span><b>${esc(o.name)}</b></div><div class="kv"><span>Mobile</span><b>${esc(o.phone)}</b></div><div class="kv"><span>Delivery</span><b>${esc(o.delivery)}</b></div>${o.address?`<div class="kv"><span>Address</span><b>${esc(o.address)} ${esc(o.pincode)}</b></div>`:""}<div class="kv"><span>Placed</span><b>${tm(o.created_at)}</b></div>${ex}${o.note?`<div class="kv"><span>Customer note</span><b>${esc(o.note)}</b></div>`:""}
 <div class="btns"><a class="btn sm" href="tel:+91${esc(o.phone)}">Call</a><a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/91${esc(o.phone)}?text=${encodeURIComponent("Hi "+o.name+", this is LegalSaathi about your request "+o.token)}">WhatsApp</a></div>
 <h2>Documents</h2><div class="files" id="fz">${o.files&&o.files.length?"Loading…":'<small>No files uploaded.</small>'}</div>
 <h2>Status <small style="display:inline">(tap a step to set it)</small></h2><ol class="tl">${steps}</ol>${L.i<L.n-1?`<button class="btn" data-nx>Move to next step</button>`:""}
 <h2>Internal note</h2><textarea id="inn" rows="3" placeholder="Visible to staff only">${esc(o.internal_note)}</textarea><button class="btn sm ghost" data-sn>Save note</button>${own()?`<div style="margin-top:24px"><button class="btn sm red" data-del>Delete order</button></div>`:""}`);
 if(o.files&&o.files.length){const{data}=await sb.storage.from("order-docs").createSignedUrls(o.files,3600);if(cur!=id)return;$("#fz").innerHTML=(data||[]).map(f=>{const n=(f.path||"").split("/").pop();return f.signedUrl?(/\.(jpe?g|png|webp|gif)$/i.test(n)?`<a target="_blank" rel="noopener" href="${esc(f.signedUrl)}"><img src="${esc(f.signedUrl)}" alt=""></a>`:`<a target="_blank" rel="noopener" href="${esc(f.signedUrl)}"><span>PDF</span></a>`):""}).join("")||'<small>Could not load files.</small>'}}
async function setStep(o,k){const v={status_idx:k,status_at:new Date().toISOString()},{error}=await sb.from("orders").update(v).eq("id",o.id);if(error)return toast("Failed","Could not update status.");Object.assign(o,v);toast("Status updated",esc(o.token));openO(o.id);render()}
document.addEventListener("click",async e=>{const g=s=>e.target.closest(s);
 if(g("[data-o]"))return openO(g("[data-o]").dataset.o);
 if(g("[data-x]"))return closeDw();
 const o=ords.find(x=>x.id==cur);
 if(g("[data-k]")&&o){const k=+g("[data-k]").dataset.k,L=live(o);if(k==L.n-1&&!confirm("Mark as "+L.f[k].n+"?"))return;return setStep(o,k)}
 if(g("[data-nx]")&&o)return setStep(o,live(o).i+1);
 if(g("[data-sn]")&&o){const v=$("#inn").value;const{error}=await sb.from("orders").update({internal_note:v}).eq("id",o.id);if(!error)o.internal_note=v;return toast(error?"Failed":"Saved","Internal note")}
 if(g("[data-del]")&&o&&confirm("Delete this order permanently?")){await sb.from("orders").delete().eq("id",o.id);ords=ords.filter(x=>x.id!=o.id);closeDw();return render()}
 if(g("[data-jh]")){const j=joins.find(x=>x.id==g("[data-jh]").dataset.jh);j.handled=!j.handled;await sb.from("join_requests").update({handled:j.handled}).eq("id",j.id);return render()}
 if(g("[data-jd]")&&confirm("Delete this request?")){const id=g("[data-jd]").dataset.jd;await sb.from("join_requests").delete().eq("id",id);joins=joins.filter(x=>x.id!=id);return render()}
 if(g("[data-fe]")){fs=g("[data-fe]").dataset.fe;fl=JSON.parse(JSON.stringify(svc(fs).flow||[]));return rFl()}
 if(g("[data-fa]")){const[a,i]=g("[data-fa]").dataset.fa.split(":"),k=+i;sync();if(a=="rm")fl.splice(k,1);if(a=="up"&&k>0)[fl[k-1],fl[k]]=[fl[k],fl[k-1]];if(a=="dn"&&k<fl.length-1)[fl[k+1],fl[k]]=[fl[k],fl[k+1]];if(a=="add")fl.push({n:"",m:10});return rFl()}
 if(g("[data-fsave]"))return saveFl();
 if(g("[data-sv]"))return saveCfg();
 if(g("[data-csv]"))return csv();
 if(g("[data-sa]"))return addStaff();
 if(g("[data-sd]")){const u=g("[data-sd]").dataset.sd;if(confirm("Remove this staff member?")){await sb.from("staff").delete().eq("user_id",u);stf=stf.filter(x=>x.user_id!=u);render()}}});
/* services */
function rSvc(){$("#t-services").innerHTML=(own()?"":'<p class="empty" style="padding:0 0 14px">Only the owner can change prices and status timings.</p>')+svcs.map(s=>`<div class="svc"><div class="r1"><div><b>${esc(s.title)}</b><small>${esc(s.category)} · per ${esc(s.unit)}</small></div><label class="sw"><input type="checkbox" data-ac="${esc(s.id)}" ${s.active?"checked":""} ${own()?"":"disabled"}><i></i></label></div>
 <div class="r2"><span>₹</span><input type="number" min="0" value="${s.price}" data-pr="${esc(s.id)}" ${own()?"":"disabled"}>${own()?`<button class="btn sm ghost" data-fe="${esc(s.id)}">Edit statuses</button>`:""}</div><div class="fl">${(s.flow||[]).map(x=>esc(x.n)+(x.m!=null?" "+x.m+"m":"")).join(" → ")}</div></div>`).join("")}
$("#t-services").addEventListener("change",async e=>{const t=e.target,id=t.dataset.pr||t.dataset.ac;if(!id||!own())return;const v=t.dataset.pr?{price:Math.max(0,+t.value||0)}:{active:t.checked},{error}=await sb.from("services").update(v).eq("id",id);if(!error)Object.assign(svc(id),v);toast(error?"Failed":"Saved",svc(id).title+(error?"":" updated on the website"))});
function sync(){document.querySelectorAll("#fw .fr").forEach((r,i)=>{if(fl[i]){fl[i].n=r.children[0].value;fl[i].m=r.children[1].value===""?null:+r.children[1].value}})}
function rFl(){const s=svc(fs);$("#fw").innerHTML=`<h3>${esc(s.title)} statuses<button class="ib" data-x aria-label="Close">${ic("x")}</button></h3><p class="sub" style="font-size:.82rem;color:var(--mut);margin-bottom:12px">Set minutes before a status moves to the next one automatically. Leave minutes empty to wait for you to move it manually. The last step is always manual.</p>
 ${fl.map((x,i)=>`<div class="fr"><input value="${esc(x.n)}" placeholder="Status name"><input type="number" min="1" value="${x.m==null?"":x.m}" placeholder="min"><span style="display:flex;gap:4px"><button class="ib" data-fa="up:${i}">${ic("up")}</button><button class="ib" data-fa="dn:${i}">${ic("dn")}</button><button class="ib" data-fa="rm:${i}">${ic("x")}</button></span></div>`).join("")}
 <button class="btn sm ghost" data-fa="add:0" style="margin:6px 0 14px">+ Add status</button><label style="display:flex;gap:8px;align-items:center;font-size:.84rem;margin-bottom:14px"><input type="checkbox" id="fall"> Apply to all services</label><button class="btn" data-fsave style="width:100%">Save statuses</button>`;
 $("#fw").classList.add("on");$("#ov").classList.add("on")}
async function saveFl(){sync();const c=fl.filter(x=>x.n.trim()).map((x,i,a)=>({n:x.n.trim(),m:i==a.length-1||x.m==null||x.m===""?null:Math.max(1,+x.m)}));if(c.length<2)return toast("Add more","A flow needs at least 2 statuses.");
 const ids=$("#fall").checked?svcs.map(s=>s.id):[fs],{error}=await sb.from("services").update({flow:c}).in("id",ids);if(error)return toast("Failed","Could not save.");ids.forEach(i=>svc(i).flow=c);toast("Saved","Statuses updated");closeDw();render()}
/* settings */
function rSet(){let h=`<div class="card"><h3 style="margin-bottom:8px">Alerts</h3><p style="font-size:.84rem;color:var(--mut);margin-bottom:12px">Turn on popups and sound for new orders and join requests. Works while this page is open in a browser tab.</p><button class="btn sm" onclick="$('#bell').click()">Enable alerts</button></div>`;
 if(own())h+=`<div class="card" style="margin-top:14px"><h3 style="margin-bottom:12px">Website control</h3><label class="l">Announcement banner (shown on the homepage, empty to hide)</label><input id="cb" value="${esc(cfg.banner)}" placeholder="e.g. Diwali offer: 10% off all affidavits"><label style="display:flex;gap:10px;align-items:center;font-size:.88rem;margin-bottom:14px"><span class="sw"><input type="checkbox" id="co" ${cfg.orders_open=="false"?"":"checked"}><i></i></span> Accepting online orders</label><button class="btn sm" data-sv>Save</button></div>
 <div class="card" style="margin-top:14px"><h3 style="margin-bottom:12px">Staff</h3>${stf.map(s=>`<div class="kv"><span>${esc(s.name)}</span><b>${esc(s.role)} ${s.user_id==me.user_id?"(you)":`<button class="ib" style="display:inline-grid;width:28px;height:28px" data-sd="${s.user_id}">${ic("x")}</button>`}</b></div>`).join("")}
 <p style="font-size:.78rem;color:var(--mut);margin:14px 0 8px">To add someone: Supabase → Authentication → Users → Add user. Then paste their User ID here.</p><input id="su" placeholder="User ID (uuid)"><input id="sn" placeholder="Name"><select id="sr"><option>manager</option><option>owner</option></select><button class="btn sm" data-sa>Add staff</button></div>
 <div class="card" style="margin-top:14px"><h3 style="margin-bottom:8px">Export</h3><button class="btn sm ghost" data-csv>Download orders (CSV)</button></div>`;
 $("#t-settings").innerHTML=h}
async function saveCfg(){const{error}=await sb.from("settings").upsert([{key:"banner",value:$("#cb").value.trim()},{key:"orders_open",value:String($("#co").checked)}]);if(!error){cfg.banner=$("#cb").value.trim();cfg.orders_open=String($("#co").checked)}toast(error?"Failed":"Saved","Website settings")}
async function addStaff(){const u=$("#su").value.trim(),n=$("#sn").value.trim();if(!u||!n)return toast("Missing","Enter user ID and name.");const{error}=await sb.from("staff").insert({user_id:u,name:n,role:$("#sr").value});if(error)return toast("Failed","Check the user ID.");const s=await sb.from("staff").select("*");stf=s.data||[];render()}
function csv(){const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"',r=[["Token","Service","Name","Phone","Delivery","Address","Pincode","Status","Placed"]].concat(ords.map(o=>{const L=live(o);return[o.token,o.service_title,o.name,o.phone,o.delivery,o.address,o.pincode,L.f[L.i]?L.f[L.i].n:"",o.created_at]}));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.map(x=>x.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="legalsaathi-orders.csv";a.click()}
/* start */
if(!SB.url){$("#login").hidden=false;$("#lerr").textContent="Add your Supabase URL and key in this file first."}else sb.auth.getSession().then(({data})=>data.session?enter():$("#login").hidden=false);
</script>
</body>
</html>
